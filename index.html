  <script>
    window.chatwootSettings = {
      position: "right",
      type: "standard",
      locale: "th",
    };

    (function (d, t) {
      var BASE_URL = "https://ctcuat.dbd.go.th/api/live-chat";

      g.onload = function () {
        window.chatwootSDK.run({
          websiteToken: "qPzJqpHJKE2nLRppSGJxiura",

        });
      };
    })(document, "script");
